name: BLOCK BLOOM CI
on:
  push:
    branches:
      - main
      - feature/block-bloom-game
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Engine and storage tests
        run: npm test
      - name: Production build
        run: npm run build
